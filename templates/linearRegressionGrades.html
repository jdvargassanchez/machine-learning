<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression To Predict Grades</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="grades-page">

    <h1>Linear Regression: Calculate Grade Based on Study Hours</h1>

    <form id="formularioPrediccion" method="post">
        <label for="horas">Study Hours</label>
        <input type="number" id="horas" name="hours" required>
        <button type="submit">Predict</button>
    </form>

    <p id="mensajeError" style="display:none; color:red;"></p>

    {% if result is not none %}
        <h2>Estimated Grade: {{ result }}</h2>
    {% endif %}

    <script src="{{ url_for('static', filename='js/prediccion.js') }}"></script>

</body>
</html>
