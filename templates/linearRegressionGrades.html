<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Predictor — Linear Regression</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="grades-page">

    <div class="grades-wrapper">

        <h1>Grade Predictor</h1>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom:20px; font-size:.95rem;">
            Enter study hours to estimate a student's final grade using Linear Regression.
        </p>

        <!-- Illustrative image -->
        <div style="text-align:center; margin-bottom:28px;">
            <img
                src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=800&fit=crop&auto=format"
                alt="Student studying — grade predictor"
                style="width:100%; max-width:560px; border-radius:14px; object-fit:cover; max-height:220px; box-shadow:0 6px 28px rgba(0,0,0,0.3);"
            >
        </div>

        <div class="predict-card">

            <form id="formularioPrediccion" method="post">

                <label for="horas">Study Hours</label>
                <input
                    type="number"
                    id="horas"
                    name="hours"
                    min="0"
                    step="0.5"
                    placeholder="e.g. 5"
                    required
                >

                <button type="submit" class="btn-predict">Predict Grade →</button>

            </form>

            <p id="mensajeError" class="error-msg" style="display:none;"></p>

            {% if result is not none %}
            <div class="result-box">
                <h2>Estimated Grade: {{ result }}</h2>
            </div>
            {% endif %}

        </div>

        <div style="text-align:center; margin-top:28px;">
            <a class="back-link" href="/">Back to Home</a>
        </div>

        <div class="footer">
            <p>Machine Learning Flask Project</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/prediccion.js') }}"></script>
</body>
</html>
