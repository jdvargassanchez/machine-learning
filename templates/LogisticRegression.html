<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logistic Regression Prediction</title>
</head>
<body>

    <h2>Predicción de Compra (Regresión Logística)</h2>

    <form method="POST">

        <label>Edad:</label><br>
        <input type="number" name="edad" required><br><br>

        <label>Ingreso Mensual:</label><br>
        <input type="number" name="ingreso" required><br><br>

        <label>Visitas Web al Mes:</label><br>
        <input type="number" name="visitas" required><br><br>

        <label>Tiempo en Sitio (min):</label><br>
        <input type="number" name="tiempo" required><br><br>

        <label>Compras Previas:</label><br>
        <input type="number" name="compras" required><br><br>

        <label>Descuento Usado (0 o 1):</label><br>
        <input type="number" name="descuento" required><br><br>

        <button type="submit">Predecir</button>

    </form>

    {% if result is not none %}
        <h3>Resultado:</h3>
        {% if result == 1 %}
            <p>El usuario probablemente comprará</p>
        {% else %}
            <p>El usuario probablemente NO comprará</p>
        {% endif %}
    {% endif %}

</body>
</html>
