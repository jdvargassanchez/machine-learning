<!DOCTYPE html>
<html>
<head>
    <title>Machine Learning App</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #1f4037, #99f2c8);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        .btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1abc9c;
        }

        .menu {
            display: none;
            margin-top: 10px;
        }

        .submenu {
            display: none;
            margin-top: 10px;
        }

        .menu a, .submenu a {
            display: block;
            background: white;
            color: #2c3e50;
            padding: 10px;
            margin: 5px auto;
            width: 250px;
            border-radius: 8px;
            text-decoration: none;
        }

        .menu a:hover, .submenu a:hover {
            background: #1abc9c;
            color: white;
        }

        .team {
            margin-top: 40px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Machine Learning App</h1>

    <button class="btn" onclick="toggleUseCases()">
        📊 Machine Learning Use Cases
    </button>

    <div id="useCases" class="menu">
        <a href="/use-case1">Use Case 1</a>
        <a href="/use-case2">Use Case 2</a>
        <a href="/use-case3">Use Case 3</a>
        <a href="/use-case4">Use Case 4</a>
    </div>


    <button class="btn" onclick="toggleSupervised()">
        🤖 Supervised Machine Learning
    </button>

    <div id="supervised" class="menu">

        <button class="btn" onclick="toggleLinear()">
            📈 Linear Regression
        </button>

        <div id="linearMenu" class="submenu">
            <a href="/linear-regression-concepts">Basic Concepts</a>
            <a href="/linear-regression-app">Application</a>
        </div>

    </div>

    <div class="team">
        <h3>👥 Team Members</h3>
        <p>Person 1 - Juan David Vargas</p>
        <p>Person 2 - Camilo Andres Sichaca</p>
        <p>Person 3 - Sharick Lorena Doncel</p>
        <p>Person 4 - Santiago Jose Morales</p>
    </div>

    <script>
        function toggleUseCases() {
            let x = document.getElementById("useCases");
            x.style.display = x.style.display === "block" ? "none" : "block";
        }

        function toggleSupervised() {
            let x = document.getElementById("supervised");
            x.style.display = x.style.display === "block" ? "none" : "block";
        }

        function toggleLinear() {
            let x = document.getElementById("linearMenu");
            x.style.display = x.style.display === "block" ? "none" : "block";
        }
    </script>

</body>
</html>
