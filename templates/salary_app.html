<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Predictor — Linear Regression</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="grades-page">

    <div class="grades-wrapper">

        <h1>Salary Predictor</h1>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom:20px; font-size:.95rem;">
            Enter years of experience to estimate a salary using Linear Regression.
        </p>

        <!-- Illustrative image -->
        <div style="text-align:center; margin-bottom:28px;">
            <img
                src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=800&fit=crop&auto=format"
                alt="Professional work environment — salary predictor"
                style="width:100%; max-width:560px; border-radius:14px; object-fit:cover; max-height:220px; box-shadow:0 6px 28px rgba(0,0,0,0.3);"
            >
        </div>

        <div class="predict-card">

            <form id="formularioSalario" method="post">

                <label for="experience">Years of Experience</label>
                <input
                    type="number"
                    id="experience"
                    name="experience"
                    min="0"
                    max="50"
                    step="0.5"
                    placeholder="e.g. 5"
                    required
                >

                <button type="submit" class="btn-predict">Predict Salary →</button>

            </form>

            {% if prediction is not none %}
            <div class="result-box">
                <h2>Estimated Salary: ${{ "{:,.0f}".format(prediction) }} USD/year</h2>
            </div>
            {% endif %}

        </div>

        <div style="text-align:center; margin-top:28px;">
            <a class="back-link" href="/">Back to Home</a>
        </div>

        <div class="footer">
            <p>Machine Learning Flask Project</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
